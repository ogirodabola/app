{% extends "admin/base_admin.html" %}

{% block content %}
<h1>{{ "Editar" if noticia else "Nova" }} Notícia</h1>

<form method="post" action="/admin/noticias/{{ noticia.id }}">

  <label>Título editorial</label><br>
  <input type="text" name="titulo_editorial"
         value="{{ noticia.titulo_editorial if noticia }}"
         required><br><br>

  <label>Resumo</label><br>
  <textarea name="resumo" rows="3">{{ noticia.resumo if noticia }}</textarea><br><br>

  <label>Categoria</label><br>
  <input type="text" name="categoria"
         value="{{ noticia.categoria if noticia }}"
         placeholder="Ex: Brasileirão, Libertadores"><br><br>

  <label>Tags (separadas por vírgula)</label><br>
  <input type="text" name="tags"
         value="{{ noticia.tags | join(', ') if noticia }}"><br><br>

  <label>Imagem (URL)</label><br>
  <input type="text" name="imagem"
         value="{{ noticia.imagem if noticia }}"><br><br>

  <label>Conteúdo editorial</label><br>
  <textarea name="conteudo_editorial" rows="16">
{{ noticia.conteudo_editorial if noticia }}
  </textarea><br><br>

  <label>Status editorial</label><br>
  <select name="editorial_status">
    <option value="pendente"
      {% if noticia and noticia.editorial_status == "pendente" %}selected{% endif %}>
      Pendente
    </option>
    <option value="publicado"
      {% if noticia and noticia.editorial_status == "publicado" %}selected{% endif %}>
      Publicado
    </option>
  </select><br><br>

  <button type="submit" class="btn btn-primary">
    Salvar
  </button>

</form>
{% endblock %}
