{% extends "admin/base_admin.html" %}

{% block content %}

<div class="admin-container">

  <h1>
    {{ "Editar Notícia" if noticia else "Nova Notícia" }}
  </h1>

  <form method="post"
        enctype="multipart/form-data"
        action="{% if noticia %}/admin/noticias/{{ noticia.id }}{% else %}/admin/noticias/nova{% endif %}">

    <!-- TÍTULO EDITORIAL -->
    <div class="admin-form-group">
      <label>Título editorial</label>
      <input type="text"
             name="titulo_editorial"
             value="{{ noticia.titulo_editorial if noticia else '' }}"
             required>
    </div>

    <!-- SLUG -->
    <div class="admin-form-group">
      <label>Slug (URL da página)</label>
      <input type="text"
             name="slug"
             value="{{ noticia.slug if noticia else '' }}"
             placeholder="ex: harry-kane-brilha-na-semi">
    </div>

    <hr>
<h3>SEO Inteligente</h3>

<button type="button" id="gerar-seo" class="btn btn-secondary">
  🚀 Gerar SEO com IA
</button>

    <hr>
<h3>SEO</h3>

<div class="admin-form-group">
  <label>Palavra-chave principal</label>
  <input type="text"
         name="palavra_chave_principal"
         value="{{ noticia.palavra_chave_principal if noticia else '' }}">
</div>

<div class="admin-form-group">
  <label>Meta Title (até 60 caracteres)</label>
  <input type="text"
         name="meta_title"
         maxlength="70"
         value="{{ noticia.meta_title if noticia else '' }}">
</div>

<div class="admin-form-group">
  <label>Meta Description (até 155 caracteres)</label>
  <textarea name="meta_description"
            maxlength="160"
            rows="3">{{ noticia.meta_description if noticia else '' }}</textarea>
</div>

<div class="admin-form-group">
  <label>Canonical URL (opcional)</label>
  <input type="text"
         name="canonical_url"
         value="{{ noticia.canonical_url if noticia else '' }}">
</div>

<div class="admin-form-group">
  <label>Indexar no Google?</label>
  <select name="indexar">
    <option value="true"
      {% if not noticia or noticia.indexar %}selected{% endif %}>
      Sim
    </option>
    <option value="false"
      {% if noticia and not noticia.indexar %}selected{% endif %}>
      Não
    </option>
  </select>
</div>
    
    <!-- RESUMO -->
    <div class="admin-form-group">
      <label>Resumo</label>
      <textarea name="resumo" rows="3">{{ noticia.resumo if noticia else '' }}</textarea>
    </div>

    <!-- CATEGORIA -->
    <div class="admin-form-group">
      <label>Categoria</label>
      <input type="text"
             name="categoria"
             value="{{ noticia.categoria if noticia else '' }}"
             placeholder="Ex: Brasileirão, Libertadores, Última Hora">
    </div>

  <!-- JOGADOR RELACIONADO -->
<div class="admin-form-group">
  <label>Jogador relacionado</label>

  <input type="text"
         id="jogador-search"
         placeholder="Digite o nome do jogador"
         autocomplete="off">

  <!-- Campo real que será enviado no POST -->
  <input type="hidden"
         name="jogador_nome"
         id="jogador-hidden"
         value="{{ jogador_nome if jogador_nome else '' }}">

  <div id="jogador-results" class="autocomplete-box"></div>
</div>


<!-- TIME RELACIONADO -->
<div class="admin-form-group">
  <label>Time relacionado (opcional)</label>
  <input type="text"
         name="time_nome"
         value="{{ noticia.time_nome if noticia and noticia.time_nome else '' }}"
         placeholder="Ex: Santos">
</div>

    <!-- TAGS -->
    <div class="admin-form-group">
      <label>Tags (separadas por vírgula)</label>
      <input type="text"
             name="tags"
             value="{{ noticia.tags | join(', ') if noticia and noticia.tags else '' }}">
    </div>

    <!-- IMAGEM ATUAL -->
    {% if noticia and noticia.imagem %}
<div class="admin-form-group">
  <label>Imagem atual</label>

  <img src="{{ noticia.imagem }}"
       alt="Preview"
       style="max-width: 300px; border-radius: 6px; display:block; margin-bottom:8px;">

  <small style="color:#64748b;">
    {{ noticia.imagem }}
  </small>

  <input type="hidden" name="imagem_atual" value="{{ noticia.imagem }}">
</div>
{% endif %}

    <!-- SUBSTITUIR IMAGEM -->
    <div class="admin-form-group">
      <label>Substituir imagem (opcional)</label>
      <input type="file" name="imagem_file" accept="image/*">
    </div>

    <!-- CONTEÚDO EDITORIAL -->
    <div class="admin-form-group">
      <label>Conteúdo editorial</label>
      <textarea id="conteudo_editorial"
                name="conteudo_editorial">
{{ noticia.conteudo_editorial if noticia else '' }}
      </textarea>
    </div>

    <!-- STATUS EDITORIAL -->
    <div class="admin-form-group">
      <label>Status editorial</label>
      <select name="editorial_status" class="status-select">
        <option value="pendente"
          {% if noticia and noticia.editorial_status == "pendente" %}selected{% endif %}>
          Pendente
        </option>
        <option value="publicado"
          {% if noticia and noticia.editorial_status == "publicado" %}selected{% endif %}>
          Publicado
        </option>
      </select>
    </div>

    <!-- BOTÕES -->
    <div style="margin-top: 30px;">
      <button type="submit" class="btn btn-primary">
        Salvar
      </button>

      <a href="/admin/noticias" class="btn btn-secondary" style="margin-left: 10px;">
        Cancelar
      </a>
    </div>

  </form>

</div>

<!-- ================= SLUG AUTO FORMAT ================= -->
<script>
function gerarSlug(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s-]/g, "")
    .trim()
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .substring(0, 120);
}

document.addEventListener("DOMContentLoaded", function() {

  const tituloInput = document.querySelector('input[name="titulo_editorial"]');
  const slugInput = document.querySelector('input[name="slug"]');

  // 🔥 Gera slug automaticamente pelo título
  tituloInput.addEventListener("input", function() {
    if (!slugInput.dataset.manual) {
      slugInput.value = gerarSlug(tituloInput.value);
    }
  });

  // 🔥 Formata slug se usuário editar manualmente
  slugInput.addEventListener("input", function() {
    slugInput.dataset.manual = "true";
    slugInput.value = gerarSlug(slugInput.value);
  });

});
</script>

<!-- ================= TINYMCE ================= -->
<script src="https://cdn.tiny.cloud/1/skjq2qyvqx3pozohkaymt4ri2zyezho5lkeuh246doz049kr/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

<script>
tinymce.init({
  selector: '#conteudo_editorial',
  height: 550,
  language: 'pt_BR',
  browser_spellcheck: true,
  contextmenu: false,
  menubar: false,
  branding: false,

  plugins: [
    'image',
    'media',
    'link',
    'lists',
    'table',
    'searchreplace',
    'visualblocks',
    'wordcount',
    'code',
    'fullscreen',
    'charmap'
  ],

  toolbar:
    'undo redo | ' +
    'bold italic underline | ' +
    'image media link table | ' +
    'bullist numlist | ' +
    'visualblocks code fullscreen | ' +
    'inserirConfronto | removeformat',

  setup: function(editor) {

    editor.ui.registry.addButton('inserirConfronto', {
      text: 'Confronto',
      tooltip: 'Inserir card de confronto',
      onAction: function () {
        if (typeof abrirModalConfronto === "function") {
          abrirModalConfronto();
        } else {
          alert("Função abrirModalConfronto não encontrada.");
        }
      }
    });

  },

  content_style: `
    body {
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    h2 {
      margin-top: 24px;
    }
    img {
      max-width: 100%;
      height: auto;
    }
  `
});
</script>

</script>

<script>
document.addEventListener("DOMContentLoaded", function() {

    document.getElementById("gerar-seo").addEventListener("click", async function(e) {

        e.preventDefault();

        const titulo = document.querySelector('[name="titulo_editorial"]').value;
        const resumo = document.querySelector('[name="resumo"]')?.value || "";

        if (!titulo) {
            alert("Preencha o título primeiro.");
            return;
        }

        try {

            const response = await fetch("/admin/seo-generate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    titulo: titulo,
                    resumo: resumo
                })
            });

            if (!response.ok) {
                throw new Error("Erro na resposta do servidor");
            }

            const data = await response.json();

            console.log("SEO retornado:", data);

            document.querySelector('[name="meta_title"]').value = data.meta_title || "";
            document.querySelector('[name="meta_description"]').value = data.meta_description || "";
            document.querySelector('[name="slug"]').value = data.slug_otimizado || "";

            alert("SEO gerado com sucesso 🚀");

        } catch (error) {
            console.error(error);
            alert("Erro ao gerar SEO");
        }

    });

});
</script>

<script>
const input = document.getElementById("jogador-search");
const hiddenInput = document.getElementById("jogador-hidden");
const resultsBox = document.getElementById("jogador-results");

input.addEventListener("input", async function() {

    const query = this.value.trim();

    if (query.length < 3) {
        resultsBox.innerHTML = "";
        return;
    }

    const response = await fetch(`/admin/buscar-jogador?query=${query}`);
    const data = await response.json();

    resultsBox.innerHTML = "";

    data.forEach(j => {

        const div = document.createElement("div");
        div.classList.add("autocomplete-item");

        div.innerHTML = `
            <img src="${j.foto}" width="30" style="margin-right:8px;">
            ${j.nome} - ${j.time_atual || ''}
        `;

        div.onclick = () => {
            input.value = j.nome;
            hiddenInput.value = j.nome;  // valor real enviado no form
            resultsBox.innerHTML = "";
        };

        resultsBox.appendChild(div);
    });
});
</script>


{% endblock %}
