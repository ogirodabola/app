{% extends "admin/base_admin.html" %}

{% block content %}

<div class="admin-container">

  <h1>
    {{ "Editar Notícia" if noticia else "Nova Notícia" }}
  </h1>

  <form method="post"
        enctype="multipart/form-data"
        action="{% if noticia %}/admin/noticias/{{ noticia.id }}{% else %}/admin/noticias/nova{% endif %}">

    <!-- TÍTULO EDITORIAL -->
    <div class="admin-form-group">
      <label>Título editorial</label>
      <input type="text"
             name="titulo_editorial"
             value="{{ noticia.titulo_editorial if noticia else '' }}"
             required>
    </div>

    <!-- SLUG -->
    <div class="admin-form-group">
      <label>Slug (URL da página)</label>
      <input type="text"
             name="slug"
             value="{{ noticia.slug if noticia else '' }}"
             placeholder="ex: harry-kane-brilha-na-semi">
    </div>

    <!-- RESUMO -->
    <div class="admin-form-group">
      <label>Resumo</label>
      <textarea name="resumo" rows="3">{{ noticia.resumo if noticia else '' }}</textarea>
    </div>

    <!-- CATEGORIA -->
    <div class="admin-form-group">
      <label>Categoria</label>
      <input type="text"
             name="categoria"
             value="{{ noticia.categoria if noticia else '' }}"
             placeholder="Ex: Brasileirão, Libertadores, Última Hora">
    </div>

    <!-- JOGADOR RELACIONADO -->
<div class="admin-form-group">
  <label>Jogador relacionado (opcional)</label>
  <input type="text"
         name="jogador_nome"
         value="{{ noticia.jogador_nome if noticia and noticia.jogador_nome else '' }}"
         placeholder="Ex: Neymar">
</div>

<!-- TIME RELACIONADO -->
<div class="admin-form-group">
  <label>Time relacionado (opcional)</label>
  <input type="text"
         name="time_nome"
         value="{{ noticia.time_nome if noticia and noticia.time_nome else '' }}"
         placeholder="Ex: Santos">
</div>

    <!-- TAGS -->
    <div class="admin-form-group">
      <label>Tags (separadas por vírgula)</label>
      <input type="text"
             name="tags"
             value="{{ noticia.tags | join(', ') if noticia and noticia.tags else '' }}">
    </div>

    <!-- IMAGEM ATUAL -->
    {% if noticia and noticia.imagem %}
    <div class="admin-form-group">
      <label>Imagem atual</label>
      <img src="{{ noticia.imagem }}"
           alt="Preview"
           style="max-width: 300px; border-radius: 6px; display:block; margin-bottom:8px;">
      <small style="color:#64748b;">
        {{ noticia.imagem }}
      </small>
    </div>
    {% endif %}

    <!-- SUBSTITUIR IMAGEM -->
    <div class="admin-form-group">
      <label>Substituir imagem (opcional)</label>
      <input type="file" name="imagem_file" accept="image/*">
    </div>

    <!-- CONTEÚDO EDITORIAL -->
    <div class="admin-form-group">
      <label>Conteúdo editorial</label>
      <textarea id="conteudo_editorial"
                name="conteudo_editorial">
{{ noticia.conteudo_editorial if noticia else '' }}
      </textarea>
    </div>

    <!-- STATUS EDITORIAL -->
    <div class="admin-form-group">
      <label>Status editorial</label>
      <select name="editorial_status" class="status-select">
        <option value="pendente"
          {% if noticia and noticia.editorial_status == "pendente" %}selected{% endif %}>
          Pendente
        </option>
        <option value="publicado"
          {% if noticia and noticia.editorial_status == "publicado" %}selected{% endif %}>
          Publicado
        </option>
      </select>
    </div>

    <!-- BOTÕES -->
    <div style="margin-top: 30px;">
      <button type="submit" class="btn btn-primary">
        Salvar
      </button>

      <a href="/admin/noticias" class="btn btn-secondary" style="margin-left: 10px;">
        Cancelar
      </a>
    </div>

  </form>

</div>

<!-- ================= SLUG AUTO FORMAT ================= -->
<script>
function gerarSlug(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s-]/g, "")
    .trim()
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .substring(0, 120);
}

document.addEventListener("DOMContentLoaded", function() {

  const tituloInput = document.querySelector('input[name="titulo_editorial"]');
  const slugInput = document.querySelector('input[name="slug"]');

  // 🔥 Gera slug automaticamente pelo título
  tituloInput.addEventListener("input", function() {
    if (!slugInput.dataset.manual) {
      slugInput.value = gerarSlug(tituloInput.value);
    }
  });

  // 🔥 Formata slug se usuário editar manualmente
  slugInput.addEventListener("input", function() {
    slugInput.dataset.manual = "true";
    slugInput.value = gerarSlug(slugInput.value);
  });

});
</script>

<!-- ================= TINYMCE ================= -->
<script src="https://cdn.tiny.cloud/1/skjq2qyvqx3pozohkaymt4ri2zyezho5lkeuh246doz049kr/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

<script>
tinymce.init({
  selector: '#conteudo_editorial',
  height: 500,
  plugins: 'lists link table media code wordcount',
  toolbar: 'undo redo | blocks | bold italic underline | alignleft aligncenter alignright | bullist numlist | link media table | code',
  menubar: false,
  branding: false
});
</script>

{% endblock %}
