<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin • Giro Desportivo</title>

  <link rel="stylesheet" href="/static/css/admin.css">
</head>
  <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>

<script>
  tinymce.init({
    selector: 'textarea[name="conteudo_editorial"]',
    height: 500,
    menubar: false,
    plugins: 'lists link image table code',
    toolbar: 'undo redo | bold italic underline | h2 h3 | bullist numlist | link image | code',
    branding: false
  });
</script>
<body>

  <header class="admin-header">
    <h2>Giro Desportivo — Admin</h2>

    <nav class="admin-nav">
      <a href="/admin/dashboard">Dashboard</a>
      <a href="/admin/ads">Anúncios</a>
      <a href="/admin/noticias">Notícias</a>
      <a href="/admin/logout">Sair</a>
    </nav>
  </header>

  <main class="admin-container">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
