{% extends "admin/base_admin.html" %}

{% block content %}
<h1>Notícias</h1>

<a href="/admin/noticias/nova" class="btn" style="margin-bottom:16px;display:inline-block">
  Nova notícia
</a>

<form method="get" style="margin-bottom:20px; display:flex; gap:10px;">

  <input type="text"
         name="busca"
         placeholder="Buscar por título..."
         value="{{ busca or '' }}"
         style="padding:8px; width:300px;">

  <select name="status">
    <option value="">Todos os status</option>
    <option value="pendente" {% if status == "pendente" %}selected{% endif %}>
      Pendente
    </option>
    <option value="publicado" {% if status == "publicado" %}selected{% endif %}>
      Publicado
    </option>
  </select>
  <select name="fonte">
  <option value="">Todos os Crawlers</option>
  <option value="goal_brasil" {% if fonte == "goal_brasil" %}selected{% endif %}>Goal</option>
  <option value="torcedores" {% if fonte == "torcedores" %}selected{% endif %}>Torcedores</option>
  <option value="gazeta" {% if fonte == "gazeta" %}selected{% endif %}>Gazeta</option>
  <option value="ge" {% if fonte == "ge" %}selected{% endif %}>GE</option>
</select>

  <select name="categoria">
    <option value="">Todas categorias</option>
    <option value="Brasileirão" {% if categoria == "Brasileirão" %}selected{% endif %}>
      Brasileirão
    </option>
    <option value="Última Hora" {% if categoria == "Última Hora" %}selected{% endif %}>
      Última Hora
    </option>
    <option value="Análises" {% if categoria == "Análises" %}selected{% endif %}>
      Análises
    </option>
  </select>

  <button type="submit" class="btn btn-primary">
    Buscar
  </button>

  <a href="/admin/noticias" style="padding:8px;">
    Limpar
  </a>

</form>

<table>
  <tr>
    <th>Título</th>
    <th>Categoria</th>
    <th>Status</th>
    <th>Ações</th>
  </tr>

  {% for n in noticias %}
  <tr>
    <td>{{ n.titulo_editorial or n.titulo }}</td>
    <td>{{ n.categoria or "-" }}</td>
    <td>{{ n.editorial_status }}</td>
    <td>
      <a class="btn" href="/admin/noticias/{{ n.id }}">Editar</a>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
