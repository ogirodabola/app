{% extends "base.html" %}

{% block title %}Giro Desportivo{% endblock %}

{% block content %}
<div class="container content-stack">

  <!-- ÚLTIMA HORA -->
  <section>
    <h2 class="section-title">Última Hora</h2>

    <div class="cards-grid">
      {% for n in ultima_hora %}
        <a href="/noticia/{{ n.slug }}" class="card">

          {% if n.imagem %}
          <div class="card-image">
            <img src="{{ n.imagem }}" alt="{{ n.titulo }}" loading="lazy">
          </div>
          {% endif %}

          <div class="card-body">
            <span class="badge">{{ n.categoria }}</span>

            <h3 class="card-title">
              {{ n.titulo }}
            </h3>

            <p class="card-meta">
              {{ n.fonte }} · {{ n.criada_em.strftime("%d/%m %H:%M") }}
            </p>
          </div>

        </a>
      {% endfor %}
    </div>
  </section>

</div>
{% endblock %}
