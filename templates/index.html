{% extends "base.html" %}

{% block content %}

<h1>Últimas Notícias</h1>

<nav class="categorias">
    <a href="/" {% if not categoria_ativa %}class="ativa"{% endif %}>
        Todas
    </a>

    {% for cat in categorias %}
        <a href="/?categoria={{ cat }}"
           {% if categoria_ativa == cat %}class="ativa"{% endif %}>
            {{ cat }}
        </a>
    {% endfor %}
</nav>

<section class="lista-noticias">
    {% for n in noticias %}
        <article class="noticia">
            <h2>
                <a href="/noticia/{{ n.slug }}">
                    {{ n.titulo }}
                </a>
            </h2>

            <div class="meta">
                <span class="categoria">{{ n.subcategoria }}</span> ·
                <span class="fonte">{{ n.fonte }}</span> ·
                <span class="data">{{ n.criada_em }}</span>
            </div>
        </article>
    {% else %}
        <p>Nenhuma notícia encontrada.</p>
    {% endfor %}
</section>

{% endblock %}
