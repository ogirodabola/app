<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}GIRO DESPORTIVO{% endblock %}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS DO PROJETO -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
  <div class="container site-header__inner">

    <!-- LOGO -->
    <div class="logo">
  <a href="/" aria-label="Giro Desportivo - Página inicial">
    <img
      src="{{ url_for('static', path='img/giro-desportivo-logo.png') }}"
      alt="Giro Desportivo"
      loading="eager"
    >
  </a>
</div>

    <!-- NAV FIXO (SEMPRE VISÍVEL) -->
    <nav class="top-nav">
      <a href="/">Notícias</a>
      <a href="/agenda">Agenda</a>
    </nav>

    <!-- BOTÃO SANDUÍCHE (SEMPRE VISÍVEL) -->
    <button
      class="menu-toggle"
      data-menu-toggle
      aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</header>


  <!-- OVERLAY -->
  <div class="menu-overlay"></div>

  <!-- MENU MOBILE -->
  <nav class="mobile-menu" aria-hidden="true">

  <!-- FUTEBOL -->
  <div class="menu-section">
    <span class="menu-title">Futebol</span>
    <ul>
      <li>
        <a href="/categoria/campeonato-brasileiro">
          Campeonato Brasileiro
        </a>
      </li>
      <li>
        <a href="/categoria/campeonatos-nacionais">
          Campeonatos Nacionais
        </a>
      </li>
      <li>
        <a href="/categoria/torneios-sulamericanos">
          Torneios Sul-Americanos
        </a>
      </li>
      <li>
        <a href="/categoria/ligas-europeias">
          Ligas Europeias
        </a>
      </li>
    </ul>
  </div>

  <!-- DIVISOR -->
  <div class="menu-divider"></div>

  <!-- GIRO DESPORTIVO -->
  <div class="menu-section">
    <span class="menu-title">Giro Desportivo</span>
    <ul>
      <li>
        <a href="/categoria/basquete">
          Basquete
        </a>
      </li>
      <li>
        <a href="/categoria/volei">
          Vôlei
        </a>
      </li>
      <li>
        <a href="/categoria/tenis">
          Tênis
        </a>
      </li>
      <li>
        <a href="/categoria/formula-1">
          Fórmula 1
        </a>
      </li>
    </ul>
  </div>

</nav>


  <!-- CONTEÚDO -->
  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>© GIRO DESPORTIVO</p>
  </footer>

  <!-- JS DO HEADER -->
  <script src="{{ url_for('static', path='js/header.js') }}" defer></script>

</body>
</html>
