<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}GIRO DESPORTIVO{% endblock %}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS DO PROJETO -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
  <div class="container site-header__inner">

    <!-- LOGO -->
    <div class="logo">
      GIRO DESPORTIVO
    </div>

    <!-- NAV FIXO (SEMPRE VISÍVEL) -->
    <nav class="top-nav">
      <a href="/">Notícias</a>
      <a href="/agenda">Agenda</a>
    </nav>

    <!-- BOTÃO SANDUÍCHE (SEMPRE VISÍVEL) -->
    <button
      class="menu-toggle"
      data-menu-toggle
      aria-label="Abrir menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>
</header>


  <!-- OVERLAY -->
  <div class="menu-overlay"></div>

  <!-- MENU MOBILE -->
  <nav class="mobile-menu" aria-hidden="true">
    <ul>
      <li><a href="/">Notícias</a></li>
      <li><a href="/agenda">Agenda</a></li>
    </ul>
  </nav>

  <!-- CONTEÚDO -->
  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>© GIRO DESPORTIVO</p>
  </footer>

  <!-- JS DO HEADER -->
  <script src="{{ url_for('static', path='js/header.js') }}" defer></script>

</body>
</html>
