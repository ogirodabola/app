<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}GIRO DESPORTIVO{% endblock %}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS ÚNICO DO PROJETO -->
  <link rel="stylesheet" href="{{ url_for('static', path='main.css') }}">
</head>
  <script src="{{ url_for('static', path='js/header.js') }}" defer></script>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container site-header__inner">
      <h1 class="logo">⚽ GIRO <strong>DESPORTIVO</strong></h1>

      <nav class="desktop-nav">
        <a href="/">Notícias</a>
        <a href="/agenda">Agenda</a>
      </nav>

      <button
        class="menu-toggle"
        data-menu-toggle
        aria-label="Abrir menu">
        ☰
      </button>
    </div>
  </header>

  <!-- OVERLAY -->
  <div class="menu-overlay"></div>

  <!-- MENU MOBILE -->
  <nav class="mobile-menu" aria-hidden="true">
    <ul>
      <li><a href="/">Notícias</a></li>
      <li><a href="/agenda">Agenda</a></li>
    </ul>
  </nav>

  <!-- CONTEÚDO -->
  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <p>© GIRO DESPORTIVO</p>
  </footer>

  <!-- JS DETERMINÍSTICO -->
  <script>
    (function () {
      const toggle = document.querySelector('[data-menu-toggle]');
      const menu = document.querySelector('.mobile-menu');
      const overlay = document.querySelector('.menu-overlay');

      if (!toggle || !menu || !overlay) return;

      function openMenu() {
        menu.classList.add('is-open');
        overlay.classList.add('is-active');
        menu.setAttribute('aria-hidden', 'false');
      }

      function closeMenu() {
        menu.classList.remove('is-open');
        overlay.classList.remove('is-active');
        menu.setAttribute('aria-hidden', 'true');
      }

      toggle.addEventListener('click', openMenu);
      overlay.addEventListener('click', closeMenu);
    })();
  </script>

</body>
</html>
